; Dialog log - settings (<game>tmt_mods	rails_dialog_logger.ini).
;
; Read at start-up and edited in place: the overlay's settings bar (F2) changes these values and the
; panel writes its live size back when it closes, comments and unknown lines are left alone. This file
; is the documented copy - the installer writes it when the game folder has none.
;
; Where the text comes from: the game's own "set the message's run" call (0x701E50 in the supported
; ed8.exe), a thiscall with ecx = the message state and the run pointer as its argument.
;   speaker = the name plate the game is going to draw   (message state + 0x358)
;   text    = the bytes of the run the game just set
; Both are read from the game in that one frame: nothing is searched, matched or indexed. The
; addresses are checked against the supported exe's bytes first; on a mismatch nothing is hooked.
[General]
Enabled=true
; LogToFile=true keeps the dialog in atmt_dialogs.jsonl and atmt_latest.txt next to the game (what
; tools\export_log.py reads). It is off by default: then this mod writes no files at all (no
; atmt_diagnostics.log either - Diagnostics is ignored while it is off), and the lines still exist in
; memory, so the overlay panel (F3) shows exactly what it would have shown. The loader's own atmt_loader.log is
; the loader's file, not the mod's: it only gets errors (LogLevel=errors in atmt_loader.ini), and
; LogLevel=off turns those off too.
LogToFile=false
MessageHook=0x701E50
MessagePlateOffset=0x358
MessageTextSkip=5                      ; the `11 <u32>` opcode before a run is 5 bytes; skipped when present

; A line whose plate has not been written yet waits this long, then the plate is re-read
; from the same object (the game sets it a moment after the line).
PendingSpeakerMs=700

; Diagnostics: writes atmt_diagnostics.log next to the game - one line per message (the run's
; address, where the bytes were found, the name plate and the text), plus a report whenever the
; hook runs but the bytes it was handed are not a readable run. That report is how a missed line
; announces itself instead of simply not appearing. Off by default; the dialog log stays clean
; either way.
Diagnostics=false
; (older builds used DebugLog / CandidateDiagnostics here; both are replaced by Diagnostics,
; and any key the mod does not know is reported in atmt_loader.log rather than ignored silently)

; --------------------------------------------------------------------------------------
; The panel (docs/OVERLAY.md): the same log, drawn over the game. F3 opens and closes it; while it
; is open the game loses the input the panel uses (the pad and the DirectInput keyboard are read by
; the mod and swallowed) - d-pad, arrows or the left stick to scroll (holding a direction speeds up
; the longer it is held), the right stick to resize the sheet, Ctrl+Up/Ctrl+Down or Y/X for the text
; size, A to follow the newest line again, B or Esc to close. Nothing about the log itself changes:
; the panel is a view of atmt_dialogs.jsonl.
[Overlay]
Overlay=true                 ; master switch for the panel
OverlayKey=F3                ; any key: F1..F24, PAGEUP, HOME, "`", a letter, a digit, ... - or a
                             ; chord: modifiers (Ctrl, Shift, Alt, Win) and one key joined by "+",
                             ; e.g. Ctrl+F3 or Shift+Alt+L. A chord needs exactly its modifiers:
                             ; F3 does not fire while Ctrl is held
OverlayLines=500             ; how far back the panel can scroll (what it keeps in memory)
OverlayNewestFirst=false     ; false: oldest line first, the newest at the bottom (a chronicle)
                             ; true:  newest line first, at the top (a tail). Opening the panel always
                             ;        starts at the newest line either way
OverlayCapture=true          ; while open, swallow the pad and the DirectInput keyboard
OverlayAnchor=BottomLeft     ; TopLeft / TopRight / Center / BottomLeft / BottomRight
OverlayWidthPct=62           ; the sheet's size, percent of the game's client area (5..100). The
OverlayHeightPct=48          ; right stick resizes both live while the panel is open (up/right
                              ; grow it) the same way Ctrl+Up/Ctrl+Down resizes the text - held
                              ; longer it moves faster. A live change here (this or the font size
                              ; below) is written back into this file on its own when the panel is
                              ; next closed - nothing to copy by hand.
OverlayOpacityPct=92         ; the sheet's own alpha
OverlayDimPct=30             ; dim the game behind it (0 = leave the game as it is)
OverlayTimestamps=true       ; show when each line was logged
OverlayGameFont=true         ; draw the log with the game's own font (the one SenPatcher / an HD pack
                             ; installed, read from the game's memory) - it has the game's symbols,
                             ; e.g. the heart. false = the overlay's font (atmt_overlay.ini)
OverlayFontSize=20            ; pixels of the game's client area (8..128). Ctrl+Up/Ctrl+Down or Y/X
                              ; on the pad change it live (see OverlayWidthPct on saving it)
OverlayPadClose=B            ; the pad button that closes the panel
OverlayPadToggle=            ; a pad button that also opens it (empty = the keyboard only)
                             ; (the pad keys also take a chord: L3+R3, back+start, ...)

; The overlay itself - the settings bar's keys (F2 / L3+R3), the mouse and its cursor, and the font
; file - is the overlay mod's: <game>\atmt_mods\atmt_overlay.ini, or its "Overlay" menu in the bar.

; Development only, off by default: the running game hands itself over to a freshly built dll whose
; path is written into <game>\atmt_reload.txt (tools\dev_cycle.ps1 does the whole loop, see
; docs/BUILD.md).
DevReload=false
